name: Audit Bot Commits

# Tripwire for the pipeline's direct-push lane. Collection/qualify agents push
# straight to main with a Contents:write PAT while processing untrusted scraped
# content, and their commits carry [skip ci] so no push-triggered check sees
# them. This workflow runs after each pipeline run and on a daily sweep.
#
# Detection logic lives in .github/scripts/audit-commits.sh so it can be run
# and tested locally. This file only turns its output into a GitHub issue.

on:
  workflow_run:
    workflows: ["OSINT Snapshot Collection", "Identify OSINT Tips", "Qualify OSINT Tips"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '30 6 * * *'   # daily sweep (UTC)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Audit direct pushes to main
        id: audit
        run: |
          set -uo pipefail
          if bash .github/scripts/audit-commits.sh > violations.tsv; then
            echo "Audit clean: every direct push to main stayed within the allowed data paths."
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            cat violations.tsv
          fi

      # Only fails on violations this workflow has not already reported, so a
      # single unresolved incident cannot produce an endless run of red X's.
      - name: Report new violations
        if: steps.audit.outputs.clean == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Bot commit audit violation
        run: |
          set -euo pipefail
          ISSUE=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "$TITLE in:title" --json number --jq '.[0].number // empty')

          REPORTED=""
          if [ -n "$ISSUE" ]; then
            REPORTED=$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" \
              --json body,comments --jq '.body, .comments[].body')
          fi

          NEW=""
          while IFS=$'\t' read -r sha author paths; do
            [ -n "$sha" ] || continue
            case "$REPORTED" in *"$sha"*) continue ;; esac
            NEW="${NEW}- \`${sha}\` (${author}): ${paths}"$'\n'
          done < violations.tsv

          if [ -z "$NEW" ]; then
            echo "::notice::Violations already reported on issue #${ISSUE}; nothing new."
            exit 0
          fi

          echo "::error::Direct push(es) to main touched paths outside the allow-list."
          BODY="Commit(s) pushed directly to \`main\` (not via a pull request) modified files outside the allowed data paths. Investigate for prompt injection or a broken runtime script.

          Allowed: \`data/events/**\`, \`data/indexes/**\`, \`data/queue/**\`, \`data/stats.json\`, \`LEARNINGS.md\`

          ${NEW}
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
          exit 1
