name: Deploy Pages

# Builds the React search frontend into docs/, copies the search index
# alongside it, and deploys to GitHub Pages at https://osint.builders/.
#
# Concurrency lives at the workflow level: a superseded Pages deploy is safe to
# cancel and replace, so cancel-in-progress is on. (Job-level groups shared
# across jobs of the same run cancel each other — see release-cli.yml.)
#
# Pages source must be set to "GitHub Actions" in Settings -> Pages -> Source.
# (One-time manual step.)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'builder/embeddings/backfill_event_details.py'
      - '.github/workflows/deploy-pages.yml'
  workflow_run:
    workflows: ["Build Search Embeddings"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        # PAGES_BASE='/' for custom domain deployment at https://osint.builders/
        # Vite emits asset URLs relative to the domain root.
        run: PAGES_BASE="/" npm run build
        working-directory: frontend

      - name: Generate event detail files for frontend (from JSONL)
        run: python3 builder/embeddings/backfill_event_details.py

      - name: Copy indexes into docs for Pages upload
        run: |
          if [ -d data/indexes ]; then
            cp -r data/indexes docs/indexes
          else
            echo "::warning::data/indexes/ not found. Searches will fail until embeddings.yml runs."
          fi

      - name: Verify build output
        run: |
          test -f docs/index.html || { echo "::error::docs/index.html missing after build"; exit 1; }
          if [ ! -d docs/indexes ] || [ -z "$(ls -A docs/indexes 2>/dev/null)" ]; then
            echo "::warning::docs/indexes/ is empty. The site will deploy but searches will fail until embeddings.yml runs at least once."
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
