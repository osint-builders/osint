name: Daily OSINT Collection

on:
  schedule:
    - cron: '0 9,13,17 * * *'
      timezone: America/New_York
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'data/**'
      - 'docs/**'
      - 'data/indexes/**'
      - 'LEARNINGS.md'
      - '**/*.md'
      - 'builder/**/*.py'
      - 'builder/**/*.js'
      - 'builder/**/*.ts'
      - 'frontend/**'
      - '.github/**'
      - 'skills/**'

concurrency:
  group: osint-collection
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  WARP_API_KEY: ${{ secrets.WARP_API_KEY }}
  WARP_ENVIRONMENT_ID: ${{ secrets.WARP_ENVIRONMENT_ID }}
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
  AGENT_PROVIDER: ${{ vars.AGENT_PROVIDER || 'auto' }}
  PARALLEL_AGENT_COUNT: ${{ vars.PARALLEL_AGENT_COUNT || '10' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: builder/package-lock.json

      - name: Install builder dependencies
        run: npm ci
        working-directory: builder

      - name: Install Mistral Vibe CLI
        if: env.MISTRAL_API_KEY != ''
        run: |
          curl -LsSf https://mistral.ai/vibe/install.sh | bash
          echo "$HOME/.vibe/bin" >> $GITHUB_PATH
          vibe --version

      - name: Run OSINT collection
        run: npm run collect
        working-directory: builder
        env:
          REPO_ROOT: ${{ github.workspace }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.OSINT_GH_TOKEN }}
