name: Deploy Downstream Artifacts

# Two independent consumers of "Build Search Embeddings" output, run as
# parallel job groups in one workflow:
#   - Pages:  builds the React search frontend + deploys docs/ to GitHub Pages
#   - CLI:    cross-compiles the Go CLI and re-points the cli-latest release
#
# Each job group keeps its own concurrency group (see per-job `concurrency:`
# blocks) since they have different cancellation semantics: a stale Pages
# deploy is safe to cancel and replace, but a partially-built CLI release
# should run to completion before a newer trigger reuses the runner.
#
# Triggers:
#   1. push to main when frontend source OR the search index changes
#      (Pages only — a frontend-only change has no reason to rebuild the CLI)
#   2. workflow_run after "Build Search Embeddings" completes (both groups;
#      the CLI group additionally requires that run to have succeeded)
#   3. workflow_dispatch for manual rebuilds of either artifact
#
# Pages source must be configured to "GitHub Actions" in
# Settings → Pages → Source. (One-time manual step.)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'data/indexes/**'
      - '.github/workflows/deploy-downstream.yml'
  workflow_run:
    workflows: ["Build Search Embeddings"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GO_VERSION: '1.22'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ══════════════════════════════ Pages ═══════════════════════════════
  pages-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        # PAGES_BASE='/' for custom domain deployment at https://osint.builders/
        # Vite emits asset URLs relative to the domain root.
        run: PAGES_BASE="/" npm run build
        working-directory: frontend

      - name: Generate event detail files for frontend (from JSONL)
        run: python3 builder/embeddings/backfill_event_details.py

      - name: Copy indexes into docs for Pages upload
        run: |
          if [ -d data/indexes ]; then
            cp -r data/indexes docs/indexes
          else
            echo "::warning::data/indexes/ not found. Searches will fail until embeddings.yml runs."
          fi

      - name: Verify build output
        run: |
          test -f docs/index.html || { echo "::error::docs/index.html missing after build"; exit 1; }
          if [ ! -d docs/indexes ] || [ -z "$(ls -A docs/indexes 2>/dev/null)" ]; then
            echo "::warning::docs/indexes/ is empty. The site will deploy but searches will fail until embeddings.yml runs at least once."
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # ═══════════════════════════════ CLI ═════════════════════════════════
  cli-prepare:
    # Only run when triggered manually or when the embeddings workflow succeeded.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: build-cli
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Prepare embed data
        run: bash cli/scripts/prepare-data.sh

      - name: Upload embed artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-embed-data
          path: cli/embed/*.gz
          retention-days: 1

  cli-build:
    needs: cli-prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: build-cli
      cancel-in-progress: false
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download embed data
        uses: actions/download-artifact@v4
        with:
          name: cli-embed-data
          path: cli/embed

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          cd cli
          go build -trimpath -ldflags="-s -w" -o ../osintcli-${{ matrix.suffix }}${{ matrix.ext }} .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: osintcli-${{ matrix.suffix }}
          path: osintcli-${{ matrix.suffix }}${{ matrix.ext }}
          retention-days: 5

  cli-release:
    needs: cli-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: build-cli
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: osintcli-*
          merge-multiple: true

      - name: List binaries
        run: ls -lh artifacts/

      - name: Delete previous cli-latest release and move tag
        run: |
          # Delete the existing release (if any) so assets don't accumulate
          gh release delete cli-latest --yes --cleanup-tag 2>/dev/null || true
          # Force-create the tag at HEAD so the new release points to latest code
          git tag -f cli-latest
          git push origin cli-latest --force
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create cli-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cli-latest
          name: OSINT CLI Tool (latest)
          body: |
            ## OSINT CLI Tool

            Cross-platform single-file executable for querying OSINT world events
            offline. Data and semantic embeddings are baked into the binary.

            ### Download

            | Platform | Binary |
            |----------|--------|
            | Linux x86_64 | `osintcli-linux-amd64` |
            | Linux ARM64 | `osintcli-linux-arm64` |
            | macOS Intel | `osintcli-darwin-amd64` |
            | macOS Apple Silicon | `osintcli-darwin-arm64` |
            | Windows x86_64 | `osintcli-windows-amd64.exe` |

            ### Quick Start

            ```bash
            chmod +x osintcli-*        # Linux/macOS
            ./osintcli-linux-amd64 search "strait of hormuz"
            ./osintcli-linux-amd64 list --country Iran --limit 10
            ./osintcli-linux-amd64 get evt_53043659343429632
            ./osintcli-linux-amd64 similar evt_53043659343429632
            ./osintcli-linux-amd64 stats
            ```

            ### Output Formats

            `--format table` (default) | `--format json` | `--format markdown`

            ---
            🤖 Built automatically from the latest embeddings index.
          files: artifacts/osintcli-*
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: false
