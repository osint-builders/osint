name: Verify

# Keep orchestration, validation, and generated documentation in sync.

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - 'data/events/**'
      - 'data/indexes/**'
      - 'data/stats.json'
      - 'LEARNINGS.md'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: builder/package-lock.json

      - name: Install builder dependencies
        run: npm ci
        working-directory: builder

      - name: Typecheck builder
        run: npx tsc --noEmit
        working-directory: builder

      - name: Test agent lifecycle and queue recovery
        run: |
          npx tsx --test lib/*.test.ts
          npm run verify-queue-recovery
        working-directory: builder

      - name: Verify prompt template matches snapshot
        run: npm run verify-prompt
        working-directory: builder

      - name: Validate recent committed events (baseline mode)
        # Sixteen pre-October records have malformed legacy IDs; the user
        # requested future-only enforcement, so keep those records untouched.
        run: node data/scripts/validate-events.js --from 2026-10-01

      - name: Test event data scripts
        run: |
          node --test data/tests/*.test.cjs
          node --test data/scripts/tests/qualified-event.test.js

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test retention and release artifact consistency
        run: |
          python -m pip install 'numpy>=1.24,<3'
          python -m unittest discover -s builder/embeddings/tests -p test_release_consistency.py -v

      - name: Confirm skills/README.md is up to date
        run: |
          ./skills/scripts/regenerate-skills-readme.sh
          if ! git diff --exit-code skills/README.md; then
            echo ""
            echo "::error::skills/README.md is stale. Run ./skills/scripts/regenerate-skills-readme.sh and commit."
            exit 1
          fi

      - name: Lint runtime scripts
        run: |
          for f in builder/runtime/*.sh .github/scripts/*.sh; do
            bash -n "$f"
          done
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -S warning builder/runtime/*.sh .github/scripts/*.sh
          fi

      - name: Test runtime helpers
        run: |
          bash builder/runtime/tests/verify-image-enrichment.sh
          bash builder/runtime/tests/verify-submit-retry.sh
