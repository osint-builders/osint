name: Qualify OSINT Tips

# Tip & Queue architecture, stage 2 ("qualify"): drains data/queue/pending/
# (written by identify.yml) in small fixed-size batches, spawning one
# short-lived Warp cloud agent per batch to do the LLM-heavy work
# (translate, extract, E-PRIME, geocode, enrich, confidence) and commit the
# resulting World Event Entities.
#
# Cadence: on demand, plus automatically after identify.yml completes.
# identify.yml owns the only collection schedule.

on:
  workflow_dispatch:
    inputs:
      max_batches:
        description: Maximum agent batches for this manual run (blank uses the configured default)
        required: false
        type: string
  workflow_run:
    workflows: ["Identify OSINT Tips"]
    types: [completed]
    branches: [main]

# Serialize all event and index writers. Identify can still add queue tips.
concurrency:
  group: osint-data-writers
  cancel-in-progress: false
  queue: max

permissions:
  contents: write
  actions: read

env:
  WARP_API_KEY: ${{ secrets.WARP_API_KEY }}
  WARP_ENVIRONMENT_ID: ${{ secrets.WARP_ENVIRONMENT_ID }}
  # Unset → qualify.ts defaults to 3 tips per agent.
  QUALIFY_BATCH_SIZE: ${{ vars.QUALIFY_BATCH_SIZE || '' }}
  QUALIFY_MAX_BATCHES: ${{ inputs.max_batches || vars.QUALIFY_MAX_BATCHES || '' }}
  WARP_MODEL_ID: ${{ vars.WARP_MODEL_ID || '' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  qualify:
    # Only run when triggered manually, or when identify.yml actually ran
    # (any conclusion — even a partial identify pass may have left tips).
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    # Backstop only — builder/qualify.ts enforces a 10-minute per-batch
    # deadline (cancelling any run that's stuck/BLOCKED) via the same
    # agent-runner lib as collection.yml.
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: builder/package-lock.json

      - name: Load latest queued tips
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Prune expired tips
        run: |
          set -euo pipefail
          node builder/runtime/expire-tips.cjs --max-age-hours 24
          git add -A data/queue
          if git diff --cached --quiet; then
            echo "No queue cleanup needed."
            exit 0
          fi
          bash builder/runtime/git-identity.sh
          git commit -m "Prune expired OSINT tips [skip ci]"
          bash builder/runtime/push-with-retry.sh

      - name: Install builder dependencies
        run: npm ci
        working-directory: builder

      - name: Run OSINT qualify
        run: npm run qualify
        working-directory: builder
        env:
          REPO_ROOT: ${{ github.workspace }}

  alert-on-failure:
    needs: qualify
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          BODY="Qualify run failed at $(date -u +%Y-%m-%dT%H:%M:%SZ): $RUN_URL

          Common causes: exhausted Warp credits (HTTP 401/402 at spawn), an expired WARP_API_KEY or OSINT_GH_TOKEN, or failed/stuck batches. See README → Configuration for key rotation."
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "Qualify workflow failing in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Qualify workflow failing" --body "$BODY"
          fi
