name: Build Search Embeddings

# Rebuilds the semantic search index after every collection/qualify run,
# regardless of whether it succeeded or failed. Decoupled from the
# collection/Tip & Queue workflows so the cadences can evolve independently
# — collection remains the OSINT product; embeddings power a downstream
# search UI. Also runs the cross-bucket dedupe pass: parallel agents cannot
# see events that sibling buckets/batches push at the same moment.

on:
  workflow_run:
    workflows: ["OSINT Snapshot Collection", "Qualify OSINT Tips"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write     # commits data/indexes/ artifacts + data/stats.json

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Single in-flight run at a time; overlapping runs would race pushing to
# main (each commits data/indexes/ + data/stats.json).
concurrency:
  group: embeddings
  cancel-in-progress: false

jobs:
  build-embeddings:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: builder/embeddings/requirements.txt

      - name: Install embedding dependencies
        run: pip install -r builder/embeddings/requirements.txt

      - name: Install Node.js (for rebuild-indexes)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Dedupe recent day files (cross-bucket safety net)
        run: node data/scripts/dedupe-events.js --days 7

      - name: Build search index
        run: python builder/embeddings/build_index.py
        env:
          REPO_ROOT: ${{ github.workspace }}

      - name: Rebuild indexes and commit
        run: |
          # Rebuild data indexes + unified stats before committing
          node data/scripts/rebuild-indexes.js

          bash builder/runtime/git-identity.sh
          # Add deduped events + indexes; exclude generated indexes/events/
          # (regenerated at Pages deploy time).
          git add data/events data/indexes/fingerprints.json data/indexes/metadata.json data/indexes/schema.json data/indexes/embeddings.bin data/indexes/by-source.json data/indexes/by-topic.json data/indexes/by-location.json data/stats.json
          # [skip ci] prevents this push from re-triggering anything.
          git diff-index --quiet HEAD || git commit -m "Update search index, indexes, and stats

          Deduped + reindexed events at $(date -u +%Y-%m-%dT%H:%M:%SZ)

          [skip ci]"
          git pull --rebase origin main
          git push
